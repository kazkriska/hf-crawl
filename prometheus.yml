# Prometheus scrape configuration for HF Crawl
# Add this to your existing prometheus.yml on the monitoring LXC (10.1.1.20:9090)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "hf-crawl"
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ["<HF_CRAWL_HOST>:8000"]
        labels:
          service: "hf-crawl"
          environment: "production"
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "hf_crawl_.*"
        action: keep

# Alert rules for HF Crawl
rule_files:
  - "hf_crawl_alerts.yml"
