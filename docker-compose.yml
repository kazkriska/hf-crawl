version: "3.8"

services:
  hf-crawl:
    build:
      context: .
      dockerfile: Dockerfile
    image: hf-crawl:latest
    container_name: hf-crawl
    restart: unless-stopped
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_CRAWL_ENV=${HF_CRAWL_ENV:-dev}
      - HF_CRAWL_MAX_ITEMS=${HF_CRAWL_MAX_ITEMS:-}
      - HF_CRAWL_WEB_PORT=8501
      - MONITORING_PUSHGATEWAY_HOST=${MONITORING_PUSHGATEWAY_HOST:-192.168.1.11}
      - MONITORING_PUSHGATEWAY_PORT=${MONITORING_PUSHGATEWAY_PORT:-9091}
      - MONITORING_LOKI_HOST=${MONITORING_LOKI_HOST:-192.168.1.11}
      - MONITORING_LOKI_PORT=${MONITORING_LOKI_PORT:-3100}
      - MONITORING_JOB_NAME=${MONITORING_JOB_NAME:-hf-crawl}
      - MONITORING_INSTANCE_NAME=${MONITORING_INSTANCE_NAME:-prod}
      - MONITORING_PUSH_INTERVAL=${MONITORING_PUSH_INTERVAL:-30}
    volumes:
      - hf-crawl-data:/app/data
      - hf-crawl-logs:/app/logs
      # Mount web UI so updates don't require rebuild
      - ./hf-crawl-web:/app/web
    ports:
      - "${HF_CRAWL_WEB_PORT:-8501}:8501"
      - "8001:8001"

volumes:
  hf-crawl-data:
    driver: local
  hf-crawl-logs:
    driver: local
